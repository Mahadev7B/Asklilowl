services:
  - type: web
    name: asklilowl-mcp
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PUBLIC_ORIGIN
        value: https://asklilowl-chatgpt.onrender.com
      - key: ASKLILOWL_DEMO_MODE
        value: "false"
